version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: .devcontainer/web.Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    environment:
      APACHE_DOCUMENT_ROOT: /workspace
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: flinders
      DB_USER: fussapp
      DB_PASS: Strong_Pw_123!
    depends_on:
      - db
    ports:
      - "8080:80"

  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flinders
      MYSQL_USER: fussapp
      MYSQL_PASSWORD: Strong_Pw_123!
      MYSQL_ROOT_PASSWORD: rootpw
    volumes:
      - dbdata:/var/lib/mysql
      - ../db/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
    ports:
      - "3306:3306"

  pma:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    ports:
      - "8081:80"

volumes:
  dbdata:
